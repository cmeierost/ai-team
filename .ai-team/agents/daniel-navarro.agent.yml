skills:
  - id: frontend-web-delivery
    name: Frontend Web Delivery
    description: >-
      Own React web-package delivery, architecture, and state/logic separation
      while leading the frontend team.
  - id: frontend-quality-storybook
    name: Frontend Quality Storybook
    description: >-
      Use Storybook and browser-driven quality workflows to validate frontend
      components and interaction behavior.
  - id: zustand-presenter-split
    name: Zustand Presenter Split
    description: >-
      Introduce Zustand carefully, move logic into containers or controller
      hooks, and keep presentational components dumb enough for Storybook.
  - id: tanstack-query-zustand-boundary
    name: TanStack Query Zustand Boundary
    description: >-
      Split server state from runtime client state cleanly so Query owns
      fetching and Zustand stays focused on shared runtime behavior.
  - id: mediated-chat-runtime-store
    name: Mediated Chat Runtime Store
    description: >-
      Handle mediated WebSocket chat events, streaming, handoffs, and pending
      questions without leaking protocol logic into views.
  - id: web-state-logic-unit-testing
    name: Web State Logic Unit Testing
    description: >-
      Add direct unit coverage for extracted state logic such as stores,
      selectors, reducers, and runtime event appliers.
